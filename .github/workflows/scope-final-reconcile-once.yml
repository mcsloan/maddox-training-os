name: Scope Final Reconcile Once

on:
  push:
    branches:
      - docs/scope-reconcile-2026-08-21

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[scope-final-reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/scope-reconcile-2026-08-21
          fetch-depth: 0
      - name: Reconcile final contradictions
        run: node scripts/reconcile-scope-final-2026-08-21.mjs
      - name: Verify diff
        run: |
          git diff --check
          git diff -- docs/SCOPE.md
      - name: Remove one-shot machinery
        run: |
          rm scripts/reconcile-scope-final-2026-08-21.mjs
          rm .github/workflows/scope-final-reconcile-once.yml
      - name: Commit final scope truth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SCOPE.md scripts/reconcile-scope-final-2026-08-21.mjs .github/workflows/scope-final-reconcile-once.yml
          git commit -m "docs(scope): close final reconciliation contradictions [scope-final-reconciled]"
          git push
