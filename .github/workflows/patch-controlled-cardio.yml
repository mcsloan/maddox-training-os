name: Apply controlled cardio projection patch

on:
  push:
    branches:
      - fix/controlled-cardio-classification-2026-08-21

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/controlled-cardio-classification-2026-08-21

      - name: Apply exact guarded edits and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          activity_path = Path('lib/projections/activityPresentation.ts')
          activity = activity_path.read_text()
          old_instruction = '  if (category === "conditioning") return "Keep this controlled. Skip it if tired, sore, or mechanics are slipping.";'
          new_instruction = '  if (category === "conditioning" && isControlledBikeTreadmillEntry(entry)) return CONTROLLED_CARDIO_COPY;\n  if (category === "conditioning") return "Keep this controlled. Skip it if tired, sore, or mechanics are slipping.";'
          if activity.count(old_instruction) != 1:
              raise SystemExit(f'Expected exactly one controlled-cardio instruction target, found {activity.count(old_instruction)}')
          activity_path.write_text(activity.replace(old_instruction, new_instruction))

          day_path = Path('lib/projections/dayPresentation.ts')
          day = day_path.read_text()
          old_easy = '''function isEasyConditioningEntry(entry: V84DayExecutionPlanEntry) {
            const text = `${entry.entryType} ${entry.entryTitle} ${entry.notes} ${entry.appRenderHint}`.toLowerCase();
            return text.includes("bike") || text.includes("treadmill") || (entry.entryType.toLowerCase().includes("conditioning") && text.includes("fresh"));
          }'''
          new_easy = '''function isEasyConditioningEntry(entry: V84DayExecutionPlanEntry) {
            const text = `${entry.entryType} ${entry.entryTitle} ${entry.notes} ${entry.appRenderHint}`.toLowerCase();
            return entry.entryType.toLowerCase().includes("conditioning")
              && /^optional$/i.test(entry.requiredOptional)
              && text.includes("fresh")
              && isControlledBikeTreadmillEntry(entry);
          }'''
          if day.count(old_easy) != 1:
              raise SystemExit(f'Expected exactly one easy-conditioning classifier target, found {day.count(old_easy)}')
          day_path.write_text(day.replace(old_easy, new_easy))

          test_path = Path('lib/projections/controlledCardio.test.ts')
          if test_path.exists():
              raise SystemExit('Refusing to overwrite existing controlledCardio.test.ts')
          test_path.write_text('''import { describe, expect, it } from "vitest";

import { getV84DayExecutionEntries } from "../imports/v8_4/daily";
import { buildDayPresentation } from "./dayPresentation";
import { projectDayPresentationContext, projectPlannedDayActivities } from "./activityPresentation";

const CONTROLLED_CARDIO_COPY = "Controlled cardio only. Bike preferred; treadmill walk/light jog is okay. No treadmill sprinting.";

function conditioningActivity(date: string) {
  return projectPlannedDayActivities(date).find((activity) => activity.category === "conditioning");
}

function presentation(date: string) {
  const executionEntries = getV84DayExecutionEntries(date);
  const plannedActivities = projectPlannedDayActivities(date);
  return buildDayPresentation({
    date,
    executionEntries,
    plannedActivities,
    dayContext: projectDayPresentationContext(date),
  });
}

describe("controlled cardio classification", () => {
  it("projects the approved easy / medium / hard duration matrix with the approved safety copy", () => {
    const easy = conditioningActivity("2026-06-18");
    const medium = conditioningActivity("2026-06-23");
    const hard = conditioningActivity("2026-06-29");

    expect(easy?.plannedDurationMinutes).toBe(45);
    expect(medium?.plannedDurationMinutes).toBe(30);
    expect(hard?.plannedDurationMinutes).toBe(20);

    for (const activity of [easy, medium, hard]) {
      expect(activity?.athleteTitle).toBe("Controlled bike or treadmill");
      expect(activity?.instruction).toBe(CONTROLLED_CARDIO_COPY);
      expect(activity?.coachingCue).toBe(CONTROLLED_CARDIO_COPY);
    }
  });

  it("does not call hard-day controlled cardio recovery conditioning", () => {
    const day = presentation("2026-06-29");
    const cardio = day.executionSteps[4];

    expect(cardio.hidden).toBe(false);
    expect(cardio.subtitle).toBe("Conditioning");
    expect(cardio.loadImpact).toBe("Conditioning stimulus");
    expect(cardio.note).toBe(CONTROLLED_CARDIO_COPY);
    expect(cardio.guidance).toContain(CONTROLLED_CARDIO_COPY);
  });

  it("keeps the June 30 optional post-test bike hidden and recovery-labelled", () => {
    const activities = projectPlannedDayActivities("2026-06-30");
    const day = presentation("2026-06-30");
    const optionalBike = day.executionSteps[4];

    expect(activities.some((activity) => activity.category === "conditioning")).toBe(false);
    expect(optionalBike.hidden).toBe(true);
    expect(optionalBike.title).toBe("Optional Easy Bike — only if fresh");
    expect(optionalBike.subtitle).toBe("Recovery conditioning");
    expect(optionalBike.loadImpact).toBe("Recovery conditioning");
    expect(optionalBike.note).toBe(CONTROLLED_CARDIO_COPY);
  });
});
''')

          Path('.github/workflows/patch-controlled-cardio.yml').unlink()
          PY

      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/projections/activityPresentation.ts lib/projections/dayPresentation.ts lib/projections/controlledCardio.test.ts .github/workflows/patch-controlled-cardio.yml
          git diff --cached --check
          git commit -m "fix: clarify controlled cardio classification"
          git push origin HEAD:fix/controlled-cardio-classification-2026-08-21
